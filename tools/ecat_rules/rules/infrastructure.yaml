# 인프라 장치 rule (커플러, 확장 모듈 등 프로세스 데이터가 없는 장치)
# 매핑은 하지 않고, 토폴로지 정보로만 등록한다.
id: infrastructure
match: {has_pdo: false}
description: EK1100 커플러, EK1110 확장 모듈 등

default:
  pdo: none

record:            # cfg에 남기는 정보
  - vendor_id
  - product_code
  - sii_name
  - sii_order
  - position

# 참고: 상태 비트 PDO가 있는 전원 단자(EL9xxx 등)는 PDO가 있어 이 rule에 걸리지 않고
#       non_coe_io / mdp5001 rule에서 상태 입력으로 분류된다 (실장비 확인 필요)
